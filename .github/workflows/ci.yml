name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coolslush_test_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/coolslush_test_${{ github.run_id }}_${{ github.run_attempt }}
      ADMIN_PASSWORD: integration-test-password
      AUTH_SESSION_SECRET: integration-test-session-secret-at-least-32-characters
      PUBLIC_APP_URL: https://test.example.invalid
      STRIPE_SECRET_KEY: sk_test_controlled_double
      SWIKLY_WEBHOOK_SECRET: controlled-swikly-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
